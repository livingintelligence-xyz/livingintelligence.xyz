<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Page not found — Living Intelligence</title>
<meta name="description" content="The requested page could not be found." />
<meta name="robots" content="noindex,follow" />
<meta name="theme-color" content="#0D0B09" />
<meta name="color-scheme" content="dark" />

<link rel="icon" href="/favicon.ico" sizes="any" type="image/x-icon" />
<link rel="icon" href="/assets/li-icon.svg" sizes="any" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />

<link rel="stylesheet" href="/assets/fonts/fonts.css" />

<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  :root{
    --bg:#0D0B09;--fg:#F5F0E8;--fg-soft:#E8DDD0;--muted:#A8977F;
    --g3:#F5A623;--line:rgba(245,240,232,.18);
    --field:linear-gradient(158deg,#42362A 0%,#2B231B 26%,#191410 58%,#0B0908 82%,#030202 100%);
    --body:'IBM Plex Sans',system-ui,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  body{
    background:var(--bg);color:var(--fg);font-family:var(--body);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  .page{
    position:relative;min-height:100vh;min-height:100dvh;display:grid;place-items:center;
    overflow:hidden;padding:clamp(28px,6vw,88px);
  }
  .field,.glow{position:absolute;pointer-events:none}
  .field{inset:0;background:var(--field)}
  .glow{
    top:-20vh;left:50%;width:min(1000px,130vw);height:min(1000px,130vw);
    transform:translateX(-50%);background:radial-gradient(closest-side,rgba(228,87,46,.16),transparent 72%);
  }
  main{position:relative;width:min(680px,100%);animation:li-rise .8s cubic-bezier(.2,.7,.2,1) both}
  .brand{display:inline-flex;align-items:center;gap:16px;color:var(--fg);text-decoration:none}
  .brand img{width:56px;height:56px}
  .brand span{font-weight:500;text-transform:uppercase;letter-spacing:.15em;font-size:clamp(17px,3vw,22px)}
  .code{margin:clamp(56px,11vh,100px) 0 14px;font-family:var(--mono);font-size:13px;letter-spacing:.08em;color:var(--muted)}
  h1{margin:0;font-size:clamp(38px,8vw,72px);font-weight:500;line-height:1.05;letter-spacing:-.025em}
  p{max-width:38ch;margin:24px 0 0;color:var(--fg-soft);font-size:clamp(17px,2.5vw,20px);line-height:1.6;text-wrap:pretty}
  .home{
    display:inline-block;margin-top:34px;color:var(--fg-soft);font-family:var(--mono);font-size:14px;
    text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:3px;transition:color .3s,border-color .3s;
  }
  .home::before{content:"←";display:inline-block;margin-right:.5em}
  .home:hover{color:var(--g3);border-color:var(--g3)}
  .brand:focus-visible,.home:focus-visible{outline:2px solid var(--g3);outline-offset:5px;border-radius:2px}
  @media (prefers-reduced-motion:reduce){main{animation:none}}
  @keyframes li-rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="page">
  <div class="field"></div>
  <div class="glow"></div>
  <main>
    <a class="brand" href="/" aria-label="Living Intelligence home">
      <img src="/assets/li-icon.svg" alt="" width="56" height="56" />
      <span>Living Intelligence</span>
    </a>
    <div class="code">404</div>
    <h1>That page isn’t here.</h1>
    <p>The address may be incomplete, or the page may have moved.</p>
    <a class="home" href="/">Return home</a>
  </main>
</div>
</body>
</html>
